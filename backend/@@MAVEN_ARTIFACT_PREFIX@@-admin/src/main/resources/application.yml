# 项目相关配置
ruoyi:
  # 名称
  name: @@PROJECT_NAME@@
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/app/uploadPath，Linux配置 /home/app/uploadPath）
  profile: ${RUOYI_PROFILE:./uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 文件存储
file:
  storage:
    # local = 本地磁盘（默认）；minio = 对象存储
    #
    # ⚠️ 改成 minio 的前提：@@MAVEN_ARTIFACT_PREFIX@@-admin/pom.xml 里有
    #    @@MAVEN_ARTIFACT_PREFIX@@-storage-minio 的 dependency。
    #    依赖被删掉却还写着 minio → 启动直接失败，报
    #    NoSuchBeanDefinitionException: FileStorageService。
    type: local
    minio:
      # ⚠️ 写 127.0.0.1 而不是 localhost —— compose 只把端口绑在 IPv4，
      #    Windows 上 localhost 常先解析到 ::1，症状是 Connection refused 且看不出是 IPv6 的锅
      endpoint: http://127.0.0.1:@@MINIO_PORT@@
      # 桶是**项目之间的隔离边界**：同一台 MinIO 上两个项目共用桶名会静默混在一起
      bucket: @@PROJECT_SLUG@@-files
      # 与 docker-compose 用**同名**环境变量：shell 里 export 一次，两边同时生效
      access-key: ${MINIO_ROOT_USER:@@MINIO_ACCESS_KEY@@}
      secret-key: ${MINIO_ROOT_PASSWORD:@@MINIO_SECRET_KEY@@}
      # 存量本地文件回退：MinIO 里找不到就读本地磁盘。
      # ⚠️ **这是过渡手段，不是终态** —— 迁移完成后改 false，见 docs/基建/文件存储.md
      fallback-local: true

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: @@BACKEND_PORT@@
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    @@JAVA_PACKAGE_ROOT@@: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: @@REDIS_PORT@@
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: @@JAVA_PACKAGE_ROOT@@.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: @@JAVA_PACKAGE_ROOT@@.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
